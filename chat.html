<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messenger</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #0b0b0f;
            color: white;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 65px;
            background: #15151c;
            border-bottom: 1px solid #292933;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            flex-shrink: 0;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .room-name {
            font-size: 15px;
            font-weight: bold;
        }

        .room-code {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        .online {
            color: #5ee68a;
            font-size: 12px;
        }

        .leave {
            border: none;
            background: transparent;
            color: #ff6666;
            font-size: 12px;
            cursor: pointer;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #33333d;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 13px;
            border-radius: 15px;
            background: #1b1b24;
            align-self: flex-start;
        }

        .message.mine {
            background: #5865f2;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.other {
            border-bottom-left-radius: 5px;
        }

        .sender {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }

        .mine .sender {
            color: #dfe2ff;
        }

        .text {
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .time {
            font-size: 9px;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }

        .mine .time {
            color: #dfe2ff;
        }

        .system-message {
            text-align: center;
            color: #777;
            font-size: 12px;
            padding: 10px;
        }

        /* INPUT */

        .input-area {
            padding: 10px;
            background: #15151c;
            border-top: 1px solid #292933;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            border: 1px solid #30303a;
            background: #0e0e13;
            color: white;
            border-radius: 14px;
            outline: none;
            padding: 13px 15px;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #5865f2;
        }

        #sendButton {
            width: 50px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #5865f2;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #sendButton:active {
            transform: scale(0.94);
        }

        .loading {
            margin: auto;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="room-info">

            <div class="room-icon">
                💬
            </div>

            <div>

                <div class="room-name">
                    Messenger Room
                </div>

                <div class="room-code">
                    Code:
                    <span id="roomCode">------</span>
                </div>

            </div>

        </div>

        <button class="leave" onclick="leaveRoom()">
            Leave
        </button>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages">

        <div class="loading" id="loading">
            Connecting...
        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            maxlength="1000"
            autocomplete="off"
        >

        <button id="sendButton">
            ➤
        </button>

    </div>

</div>


<script type="module">

    /* =========================================
       FIREBASE IMPORTS
    ========================================= */

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onValue,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {
    apiKey: "AIzaSyBC3N8YDYFP4THCM63chP7TUOKiDjYhOes",
    authDomain: "wk-messenger.firebaseapp.com",
    databaseURL: "https://wk-messenger-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "wk-messenger",
    storageBucket: "wk-messenger.firebasestorage.app",
    messagingSenderId: "365278946366",
    appId: "1:365278946366:web:2590732df02b900d005d6f",
    measurementId: "G-1F8PCFCJBQ"
};


    /* =========================================
       INITIALIZE FIREBASE
    ========================================= */

    const app =
        initializeApp(firebaseConfig);

    const db =
        getDatabase(app);


    /* =========================================
       USER INFORMATION
    ========================================= */

    const username =
        localStorage.getItem(
            "messenger_username"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const roomCode =
        params.get("room");


    if (!username) {

        window.location.href =
            "index.html";

    }


    if (!roomCode) {

        window.location.href =
            "room.html";

    }


    document.getElementById(
        "roomCode"
    ).textContent = roomCode;


    /* =========================================
       FIREBASE ROOM REFERENCE
    ========================================= */

    const messagesRef =
        ref(
            db,
            "rooms/" +
            roomCode +
            "/messages"
        );


    /* =========================================
       RECEIVE MESSAGES
    ========================================= */

    const messagesBox =
        document.getElementById(
            "messages"
        );


    onValue(
        messagesRef,
        (snapshot) => {

            messagesBox.innerHTML = "";


            if (!snapshot.exists()) {

                messagesBox.innerHTML = `
                    <div class="loading">
                        No messages yet.<br>
                        Send the first message!
                    </div>
                `;

                return;
            }


            const data =
                snapshot.val();


            Object.entries(data).forEach(
                ([id, message]) => {

                    showMessage(
                        message
                    );

                }
            );


            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        },
        (error) => {

            console.error(error);

            messagesBox.innerHTML = `
                <div class="loading">
                    Unable to connect to chat.
                </div>
            `;

        }
    );


    /* =========================================
       SHOW MESSAGE
    ========================================= */

    function showMessage(message) {

        const div =
            document.createElement(
                "div"
            );


        if (
            message.username === username
        ) {

            div.className =
                "message mine";

        } else {

            div.className =
                "message other";

        }


        const sender =
            document.createElement(
                "div"
            );

        sender.className =
            "sender";

        sender.textContent =
            message.username;


        const text =
            document.createElement(
                "div"
            );

        text.className =
            "text";

        text.textContent =
            message.text;


        const time =
            document.createElement(
                "div"
            );

        time.className =
            "time";


        if (message.time) {

            const date =
                new Date(
                    message.time
                );

            time.textContent =
                date.toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        div.appendChild(sender);

        div.appendChild(text);

        div.appendChild(time);

        messagesBox.appendChild(div);

    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    const input =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    async function sendMessage() {

        const text =
            input.value.trim();


        if (text === "") {
            return;
        }


        try {

            await push(
                messagesRef,
                {

                    username:
                        username,

                    text:
                        text,

                    time:
                        serverTimestamp()

                }
            );


            input.value = "";

            input.focus();

        }
        catch (error) {

            console.error(error);

            alert(
                "Message send nahi hua."
            );

        }

    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================
       LEAVE ROOM
    ========================================= */

    window.leaveRoom =
        function () {

            localStorage.removeItem(
                "messenger_room"
            );

            localStorage.removeItem(
                "messenger_room_type"
            );

            window.location.href =
                "room.html";

        };


</script>

</body>
</html>
