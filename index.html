<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WK Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* === BOOT SEQUENCE OVERLAY === */
        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s;
        }

        #boot-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* === ANIMATED BACKGROUND MESH === */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 60%);
            animation: meshMove 8s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% {
                background: 
                    radial-gradient(ellipse at 20% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 20%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 60%);
            }
            50% {
                background: 
                    radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.2) 0%, transparent 50%),
                    radial-gradient(ellipse at 20% 20%, rgba(255, 0, 255, 0.2) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(0, 255, 136, 0.12) 0%, transparent 60%);
            }
            100% {
                background: 
                    radial-gradient(ellipse at 50% 90%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 10%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 30% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 60%);
            }
        }

        /* === FLOATING ORBS === */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.4;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.6), transparent 70%);
            top: -100px;
            left: -100px;
            animation: orbFloat1 12s ease-in-out infinite;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.5), transparent 70%);
            bottom: -80px;
            right: -80px;
            animation: orbFloat2 15s ease-in-out infinite;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.4), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 10s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 80px) scale(1.2); }
            66% { transform: translate(-50px, 120px) scale(0.9); }
        }

        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-120px, -60px) scale(1.1); }
            66% { transform: translate(80px, -100px) scale(0.8); }
        }

        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
            50% { transform: translate(-40%, -60%) scale(1.3); opacity: 0.6; }
        }

        /* === PARTICLES === */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite linear;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(100px) scale(1.5);
                opacity: 0;
            }
        }

        /* === SHOOTING STARS === */
        .shooting-star {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
            z-index: 1;
            opacity: 0;
            animation: shoot 4s ease-out infinite;
        }

        @keyframes shoot {
            0% {
                transform: translateX(-100px) translateY(0) rotate(-45deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            20% {
                transform: translateX(calc(100vw + 100px)) translateY(calc(100vh + 100px)) rotate(-45deg);
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }

        /* === GRID LINES === */
        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* === SCANLINE EFFECT === */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        /* === VIGNETTE === */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* === MAIN LOADING CONTAINER === */
        .loading-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* === 1ST: STUDIO NAME === */
        .studio-name {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 16px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInDown 1s ease-out 0.3s forwards;
            text-shadow: 
                0 0 30px rgba(0, 212, 255, 0.6),
                0 0 60px rgba(0, 212, 255, 0.3),
                0 0 90px rgba(0, 212, 255, 0.1);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === 2ND: CREATOR CREDIT WITH GLITCH === */
        .creator-credit {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        .creator-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #555, transparent);
            margin: 0 auto 20px;
        }

        .creator-text {
            font-size: 12px;
            color: #666;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* === GLITCH EFFECT CONTAINER === */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .glitch-wrapper .creator-name {
            font-size: 32px;
            color: #fff;
            font-weight: 800;
            letter-spacing: 10px;
            position: relative;
            z-index: 2;
            text-shadow: 
                0 0 20px rgba(255, 0, 255, 0.6),
                0 0 40px rgba(255, 0, 255, 0.3),
                0 0 60px rgba(255, 0, 255, 0.1);
        }

        .glitch-wrapper::before,
        .glitch-wrapper::after {
            content: 'RajibX';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glitch-wrapper::before {
            color: #00ffff;
            z-index: 3;
            animation: glitch-cyan 3s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
        }

        .glitch-wrapper::after {
            color: #ff00ff;
            z-index: 3;
            animation: glitch-magenta 2s infinite linear alternate-reverse;
            clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%);
        }

        @keyframes glitch-cyan {
            0%, 100% { transform: translate(0); opacity: 0; }
            7% { transform: translate(-3px, 1px); opacity: 0.8; }
            10% { transform: translate(0); opacity: 0; }
            27% { transform: translate(2px, -1px); opacity: 0.8; }
            30% { transform: translate(0); opacity: 0; }
            35% { transform: translate(-2px, 2px); opacity: 0.8; }
            40% { transform: translate(0); opacity: 0; }
            50% { transform: translate(3px, -2px); opacity: 0.8; }
            55% { transform: translate(0); opacity: 0; }
            65% { transform: translate(-1px, 1px); opacity: 0.8; }
            70% { transform: translate(0); opacity: 0; }
            80% { transform: translate(2px, 0); opacity: 0.8; }
            85% { transform: translate(0); opacity: 0; }
        }

        @keyframes glitch-magenta {
            0%, 100% { transform: translate(0); opacity: 0; }
            5% { transform: translate(3px, -1px); opacity: 0.8; }
            8% { transform: translate(0); opacity: 0; }
            15% { transform: translate(-2px, 1px); opacity: 0.8; }
            18% { transform: translate(0); opacity: 0; }
            25% { transform: translate(1px, -2px); opacity: 0.8; }
            28% { transform: translate(0); opacity: 0; }
            45% { transform: translate(-3px, 2px); opacity: 0.8; }
            48% { transform: translate(0); opacity: 0; }
            60% { transform: translate(2px, -1px); opacity: 0.8; }
            63% { transform: translate(0); opacity: 0; }
            75% { transform: translate(-1px, 1px); opacity: 0.8; }
            78% { transform: translate(0); opacity: 0; }
            90% { transform: translate(1px, -1px); opacity: 0.8; }
            93% { transform: translate(0); opacity: 0; }
        }

        /* === 3RD: LOADING SECTION === */
        .loading-section {
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.8s forwards;
            margin-top: 20px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-bar-container {
            width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto 15px;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #ff00ff, #00ff88);
            border-radius: 3px;
            animation: loadProgress 3s cubic-bezier(0.4, 0, 0.2, 1) 2s forwards;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
            animation: shimmer 1.5s infinite;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { transform: translateX(0); }
            100% { transform: translateX(30px); }
        }

        .loading-text {
            font-size: 11px;
            color: #555;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        .loading-percentage {
            font-size: 13px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* === GAME CONTAINER === */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 2s ease-out, transform 2s ease-out;
        }

        #game-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* === AD OVERLAY === */
        #ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #ad-overlay.active {
            display: flex;
        }

        #ad-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* === SKIP AD BUTTON === */
        .skip-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10001;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ad-timer {
            font-size: 14px;
            color: #888;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .skip-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        .skip-btn.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* Countdown before skip available */
        .countdown-badge {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            border-radius: 4px;
        }

        .countdown-badge span {
            color: #00d4ff;
            font-weight: 700;
        }

        /* Ad label */
        .ad-label {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10001;
            font-size: 12px;
            color: #555;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }
    </style>
<base target="_blank">
</head>
<script>
setTimeout(function(){
    window.location.href = "game.html";
}, 6000);
</script>
<body>

    <!-- BOOT / LOADING OVERLAY -->
    <div id="boot-overlay">
        <div class="bg-mesh"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="particles" id="particles"></div>
        <div class="grid-lines"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <div class="loading-container">
            <div class="studio-name">WK Studio</div>
            <div class="creator-credit">
                <div class="creator-line"></div>
                <div class="creator-text">Created by</div>
                <div class="glitch-wrapper">
                    <div class="creator-name">RajibX</div>
                </div>
            </div>
            <div class="loading-section">
                <div class="loading-bar-container">
                    <div class="loading-bar" id="loadingBar"></div>
                </div>
                <div class="loading-text" id="loadingText">Initializing System...</div>
                <div class="loading-percentage" id="loadingPercent">0%</div>
            </div>
        </div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container">
        <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>

    <!-- AD OVERLAY -->
    <div id="ad-overlay">
        <div class="ad-label">Advertisement</div>
        <iframe id="ad-frame" src="" allowfullscreen></iframe>
        <div class="skip-container">
            <div class="countdown-badge" id="countdownBadge">Skip in <span id="countdownNum">5</span>s</div>
            <button class="skip-btn" id="skipBtn" onclick="skipAd()">Skip Ad</button>
        </div>
    </div>

    <script>
        // === PARTICLE GENERATOR ===
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (8 + Math.random() * 12) + 's';
                const colors = ['rgba(0, 212, 255, 0.6)', 'rgba(255, 0, 255, 0.6)', 'rgba(0, 255, 136, 0.6)', 'rgba(255, 255, 255, 0.4)'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // === SHOOTING STARS GENERATOR ===
        function createShootingStars() {
            const overlay = document.getElementById('boot-overlay');
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = Math.random() * 50 + '%';
                star.style.left = Math.random() * 50 + '%';
                star.style.animationDelay = (i * 1.5 + Math.random()) + 's';
                star.style.animationDuration = (3 + Math.random() * 2) + 's';
                overlay.appendChild(star);
            }
        }

        // === LOADING PERCENTAGE COUNTER ===
        function updatePercentage() {
            const percentEl = document.getElementById('loadingPercent');
            const textEl = document.getElementById('loadingText');
            let percent = 0;
            const interval = setInterval(() => {
                percent += Math.floor(Math.random() * 5) + 1;
                if (percent > 100) percent = 100;
                percentEl.textContent = percent + '%';
                if (percent < 30) textEl.textContent = 'Initializing System...';
                else if (percent < 60) textEl.textContent = 'Loading Assets...';
                else if (percent < 90) textEl.textContent = 'Optimizing...';
                else textEl.textContent = 'Launching...';
                if (percent >= 100) clearInterval(interval);
            }, 100);
        }

        // === AD SYSTEM ===
        const AD_URL = 'https://williamkaupar.github.io/Gaming-ad/';
        const AD_INTERVAL = 600000; // 10 minute
        const SKIP_DELAY = 5000;   // 5 seconds
        const AUTO_SKIP = 30000;   // 30 seconds

        let adTimer = null;
        let skipTimeout = null;
        let autoSkipTimeout = null;
        let countdownInterval = null;

        function showAd() {
            const adOverlay = document.getElementById('ad-overlay');
            const adFrame = document.getElementById('ad-frame');
            const skipBtn = document.getElementById('skipBtn');
            const countdownBadge = document.getElementById('countdownBadge');
            const countdownNum = document.getElementById('countdownNum');

            // Load ad
            adFrame.src = AD_URL;
            adOverlay.classList.add('active');

            // Reset UI
            skipBtn.classList.remove('visible');
            countdownBadge.style.display = 'block';
            countdownNum.textContent = '5';

            // Countdown for skip button
            let secondsLeft = 5;
            countdownInterval = setInterval(() => {
                secondsLeft--;
                countdownNum.textContent = secondsLeft;
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownBadge.style.display = 'none';
                    skipBtn.classList.add('visible');
                }
            }, 1000);

            // Auto skip after 30 seconds
            autoSkipTimeout = setTimeout(() => {
                skipAd();
            }, AUTO_SKIP);
        }

        function skipAd() {
            const adOverlay = document.getElementById('ad-overlay');
            const adFrame = document.getElementById('ad-frame');
            const skipBtn = document.getElementById('skipBtn');
            const countdownBadge = document.getElementById('countdownBadge');

            // Clear all timers
            clearTimeout(skipTimeout);
            clearTimeout(autoSkipTimeout);
            clearInterval(countdownInterval);

            // Hide ad
            adOverlay.classList.remove('active');
            adFrame.src = '';
            skipBtn.classList.remove('visible');
            countdownBadge.style.display = 'none';

            // Restart ad timer
            startAdTimer();
        }

        function startAdTimer() {
            if (adTimer) clearTimeout(adTimer);
            adTimer = setTimeout(() => {
                showAd();
            }, AD_INTERVAL);
        }

        // === MAIN SEQUENCE ===
        window.addEventListener('load', () => {
            createParticles();
            createShootingStars();
            updatePercentage();

            // Boot sequence complete
            setTimeout(() => {
                const overlay = document.getElementById('boot-overlay');
                const gameContainer = document.getElementById('game-container');
                
                overlay.classList.add('hidden');
                
                setTimeout(() => {
                    gameContainer.classList.add('visible');
                }, 500);
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    // Start ad timer after boot
                    startAdTimer();
                }, 2000);
                
            }, 5500);
        });

        // === KEYBOARD SHORTCUT TO REPLAY ===
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                location.reload();
            }
        });
    </script>
</body>
</html>
